<!DOCTYPE html>
<html>
<head>
    <title>Krishna Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-10">
    <h1 class="text-3xl font-bold text-blue-500 mb-5">KEY MANAGER</h1>
    <button onclick="generateKey()" class="bg-blue-600 px-6 py-2 rounded mb-10 font-bold hover:bg-blue-700">+ GENERATE NEW KEY</button>
    <table class="w-full bg-gray-800 rounded-lg">
        <tbody id="keyTable"></tbody>
    </table>
    <script>
        async function loadKeys() {
            const res = await fetch('/api/keys');
            const keys = await res.json();
            document.getElementById('keyTable').innerHTML = keys.map(k => `
                <tr class="border-b border-gray-700">
                    <td class="p-4 font-mono text-green-400">${k.keyString}</td>
                    <td class="p-4"><button onclick="deleteKey('${k._id}')" class="text-red-500 font-bold">DELETE</button></td>
                </tr>`).join('');
        }
        async function generateKey() { await fetch('/api/generate', { method: 'POST' }); loadKeys(); }
        async function deleteKey(id) { if(confirm("Delete?")) { await fetch('/api/delete/' + id, { method: 'DELETE' }); loadKeys(); } }
        loadKeys();
    </script>
</body>
</html>
